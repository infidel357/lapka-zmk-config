# If you are having connection issues it is recommended to set it
# to PLUS_8 because the power consumption difference is negligible.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# There are no LED's and OLED's so turn off external power
CONFIG_ZMK_EXT_POWER=n

# Enable sleep for halves
CONFIG_ZMK_SLEEP=y

# Sleep timeout: 5 min
CONFIG_ZMK_SLEEP_TIMEOUT=900000

# Enable Bluetooth battery reporting service
CONFIG_BT_BAS=y

# Enable ZMK battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Enable central reporting of split battery levels to hosts
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enable fetching split peripheral battery levels to the central side
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# --- Prospector Status Advertisement ---
# Обязательные параметры для работы модуля Prospector
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Lapka"  # Замените на желаемое имя (до 16 символов)

# Опционально: канал для связи (0 = широковещательный, для всех сканеров)
# CONFIG_PROSPECTOR_CHANNEL=0

# Опционально: интервалы активности (значения по умолчанию, можно не менять)
# CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
# CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=1000
# CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000
# CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=5000

# Только для раздельных клавиатур: укажите центральную сторону.
# По умолчанию считается RIGHT. Если центральная — LEFT, раскомментируйте:
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"
